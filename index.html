<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff7fa, #ffe4ec);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: floatUp 10s linear infinite;
      opacity: 0.6;
    }

    @keyframes floatUp {
      from { transform: translateY(110vh) scale(0.8); opacity: 0; }
      20% { opacity: 0.7; }
      to { transform: translateY(-20vh) scale(1.3); opacity: 0; }
    }

    .scene {
      perspective: 1200px;
      text-align: center;
      padding: 20px;
    }

    .envelope-wrap {
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .envelope-wrap:hover {
      transform: scale(1.03);
    }

    .envelope {
      width: min(520px, 94vw);
      height: 500px;
      position: relative;
      margin: 0 auto;
      transition: transform 1s ease;
      z-index: 5;
    }

    .base {
      position: absolute;
      inset: 0;
      background: #f8cdd8;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(180, 90, 120, 0.25);
      overflow: hidden;
      z-index: 3;
    }

    .base::before,
    .base::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: #efb9c9;
    }

    .base::before {
      clip-path: polygon(0 0, 50% 55%, 100% 0);
      top: 0;
    }

    .base::after {
      clip-path: polygon(0 100%, 50% 45%, 100% 100%);
      bottom: 0;
    }

    .flap {
      position: absolute;
      top: 0;
      width: 100%;
      height: 52%;
      background: #f4bfd0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transition: transform 1s ease, z-index 0s 0.45s;
      z-index: 6;
      border-radius: 12px 12px 0 0;
    }

    .seal {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 8;
      font-size: 32px;
      transition: opacity 0.35s ease;
    }

    .label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9;
      color: #8f4761;
      font-size: clamp(22px, 4vw, 34px);
      font-weight: bold;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6);
      transition: opacity 0.35s ease;
    }

    .letter {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(380px, 80vw);
      background: #fffdfd;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.18);
      z-index: 1;
      transition: z-index 0s 0.2s;
    }

    .message {
      color: #8a3d59;
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 700;
      line-height: 1.35;
      margin-top: 12px;
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope.open .label,
    .envelope.open .seal {
      opacity: 0;
      pointer-events: none;
    }

    .envelope.open + .letter,
    .letter.reveal {
      z-index: 10;
    }

    .envelope.open {
      transform: translateY(420px);
    }

    svg {
      width: 180px;
      height: auto;
    }

    @media (max-width: 600px) {
      .envelope {
        height: 430px;
        width: 94vw;
      }

      .envelope.open {
        transform: translateY(320px);
      }
    }

      .open .envelope {
        transform: translateY(220px);
      }
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <div class="scene">
    <div class="envelope-wrap" id="toggleCard">
      <div class="letter">
          <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-label="Teddy bear with heart and flowers">
            <circle cx="110" cy="110" r="90" fill="#f7e6d0"/>
            <circle cx="70" cy="55" r="24" fill="#e8d0b2"/>
            <circle cx="150" cy="55" r="24" fill="#e8d0b2"/>
            <circle cx="110" cy="90" r="60" fill="#f0dbc0"/>
            <circle cx="85" cy="85" r="8" fill="#3a2b2b"/>
            <circle cx="135" cy="85" r="8" fill="#3a2b2b"/>
            <ellipse cx="110" cy="108" rx="18" ry="14" fill="#fff3ea"/>
            <circle cx="110" cy="103" r="5" fill="#3a2b2b"/>
            <path d="M100 117 Q110 126 120 117" stroke="#3a2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M75 155 C90 130, 130 130, 145 155 C130 180, 90 180, 75 155" fill="#ff7fa4"/>
            <text x="110" y="159" text-anchor="middle" font-size="22">❤</text>
            <g><circle cx="40" cy="160" r="10" fill="#ff8db1"/><circle cx="52" cy="150" r="10" fill="#ff8db1"/><circle cx="64" cy="160" r="10" fill="#ff8db1"/><line x1="52" y1="170" x2="52" y2="195" stroke="#4f9b55" stroke-width="4"/></g>
            <g><circle cx="156" cy="160" r="10" fill="#ffd36e"/><circle cx="168" cy="150" r="10" fill="#ffd36e"/><circle cx="180" cy="160" r="10" fill="#ffd36e"/><line x1="168" y1="170" x2="168" y2="195" stroke="#4f9b55" stroke-width="4"/></g>
          </svg>
          <div class="message">Wanna know who's my favourite woman? 👀<br><br>You!!! 💖</div>
        </div>
        <div class="envelope" id="envelope">
        <div class="base"></div>
        <div class="label">Hi Nancy!!!<br>Click on me 💌<br><span style="font-size:14px; font-weight:500; margin-top:90px; display:block; line-height:1.5;"> <br> </span></div>
        <div class="flap"></div>
        <div class="seal">💗</div>
      </div>
    </div>
  </div>

  <script>
    const toggleCard = document.getElementById('toggleCard');
    const envelope = document.getElementById('envelope');
    toggleCard.addEventListener('click', () => {
      envelope.classList.toggle('open');
      const letter = document.querySelector('.letter');
      if (envelope.classList.contains('open')) {
        setTimeout(() => letter.classList.add('reveal'), 180);
      } else {
        letter.classList.remove('reveal');
      }
    });

    const hearts = document.getElementById('hearts');
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = ['💗','💖','🌸'][Math.floor(Math.random() * 3)];
      h.style.left = (Math.random() * 95) + 'vw';
      h.style.top = (Math.random() * 100) + 'vh';
      h.style.animationDelay = (-Math.random() * 10) + 's';
      h.style.fontSize = (16 + Math.random() * 20) + 'px';
      hearts.appendChild(h);
    }
  </script>
</body>
</html>
